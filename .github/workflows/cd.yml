name: CD

# ==================================================================
# main push -> 이미지 빌드 -> Docker Hub(private) push 까지가 이 워크플로의 끝.
#
# 그 뒤는 WEB EC2 의 watchtower 가 :latest 태그의 digest 변화를 폴링해서
# 알아서 컨테이너를 교체한다. 즉 이 워크플로에는 AWS 자격증명이 없다.
#
# ⚠️ 태그 전략
#    watchtower 는 "실행 중인 컨테이너가 쓰는 태그를 다시 pull 해서 digest 가
#    바뀌었는지" 만 본다. 새 태그를 찾아다니지 않는다.
#    그래서 :latest 라는 고정 태그를 매번 덮어써야 하고, EC2 의 컨테이너도
#    반드시 :latest 로 떠 있어야 한다. sha- 태그로 띄우면 영원히 갱신되지 않는다.
#
# ⚠️ 배포 브랜치는 main 이다.
#    현재 팀 작업은 dev 에서 이뤄지고 있으므로, 배포하려면 dev -> main 을
#    머지해야 한다. 급할 때는 workflow_dispatch 로 수동 실행할 수 있다.
#
# 아래 IMAGE 는 infra 레포 variables.tf 의 var.dockerhub_image 와 일치해야 한다.
# 어긋나면 CI 는 성공하는데 배포만 조용히 안 되고 아무 에러도 나지 않는다.
# ==================================================================
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_to:
        description: '되돌릴 태그 (예: sha-a1b2c3d). 비워두면 현재 커밋을 새로 빌드해서 배포합니다.'
        required: false
        default: ''

permissions:
  contents: read

env:
  IMAGE: bulletbear/kidhack-web

jobs:
  # ----------------------------------------------------------------
  # 롤백: 이미 Docker Hub 에 있는 이미지를 :latest 로 다시 가리키게만 한다.
  # 다시 빌드하지 않으므로 "그때 그 산출물" 이 그대로 돌아온다.
  # imagetools 는 매니페스트만 조작해서 레이어를 내려받지 않는다.
  # ----------------------------------------------------------------
  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.rollback_to != ''
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 입력값을 run: 안에 ${{ }} 로 직접 박으면 셸 인젝션이 된다.
      # (워크플로를 수동 실행할 수 있는 사람이 러너에서 임의 명령을 돌릴 수 있음)
      # env 로 넘기면 셸 변수라 문자열로만 취급된다.
      - name: ':latest 를 지정한 태그로 되돌린다'
        env:
          ROLLBACK_TO: ${{ inputs.rollback_to }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            "$IMAGE:$ROLLBACK_TO"

      - name: 되돌린 digest 확인
        run: docker buildx imagetools inspect "$IMAGE:latest"

  # ----------------------------------------------------------------
  # 정상 배포
  # ----------------------------------------------------------------
  build-and-push:
    if: github.event_name == 'push' || inputs.rollback_to == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 짧은 SHA 를 쓴다. 전체 40 자는 롤백할 때 사람이 옮겨 적기 어렵다.
      - name: 태그 계산
        id: meta
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # npm ci 와 빌드는 Dockerfile 안에서 돈다(멀티스테이지).
      # 러너에서 따로 빌드하지 않는 이유: 이미지 안에서 빌드해야 로컬에서
      # docker build 한 결과와 배포본이 같아진다.
      - name: 빌드 & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # ⚠️ 목 데이터가 켜진 채 배포되면 화면은 멀쩡한데 전부 가짜 데이터다.
          #    client.ts 가 `VITE_USE_MOCK !== 'false'` 로 판정하므로
          #    문자열 "false" 를 정확히 넘겨야 한다.
          build-args: |
            VITE_USE_MOCK=false
            VITE_API_BASE_URL=/api
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 배포가 실제로 반영됐는지 확인할 때 이 digest 를 기준으로 삼는다.
      # 태그 이름이 그대로여도 digest 가 안 바뀌었다면 watchtower 는 아무것도 안 한다.
      - name: 배포된 digest
        run: |
          echo "롤백이 필요하면 이 태그를 쓰세요: ${{ steps.meta.outputs.sha }}"
          docker buildx imagetools inspect "$IMAGE:latest"