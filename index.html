<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/src/assets/brand/logo-mark.png" />
    <title>kidhack 어드민</title>
    <meta name="description" content="자녀보호앱 관리자 콘솔" />
    <script>
      /* 첫 페인트 전에 저장된 테마를 적용한다. React 마운트를 기다리면
         다크 사용자에게 흰 화면이 한 번 번쩍인다.
         키 'careguard.theme' 는 src/shared/lib/constants.ts 의
         THEME_STORAGE_KEY 와 반드시 같아야 한다. OS 설정을 따르는 선택지는
         없으므로 저장값이 없으면 라이트로 시작한다. */
      var savedTheme = 'light';
      try {
        var stored = localStorage.getItem('careguard.theme');
        if (stored === 'light' || stored === 'dark') savedTheme = stored;
      } catch (e) {
        /* localStorage 접근이 막힌 환경에서는 기본값(라이트)을 쓴다 */
      }
      document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
